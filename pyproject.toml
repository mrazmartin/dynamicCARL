[project]
name = "dynamic-carl"
version = "0.1.0"
description = "Dynamic context scheduling for contextual reinforcement learning"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dynamic_carl", "src/gym_envs", "src/dmc_envs", "src/utils"]
